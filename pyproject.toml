[project]
name = "project-data-warehouse"
version = "0.1.0"
description = "ETL Pipeline — monitoring titik api aktif Indonesia dari NASA FIRMS MODIS/VIIRS 2023-2025"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "duckdb>=1.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "streamlit>=1.36.0",
    "folium>=0.18.0",
    "streamlit-folium>=0.24.0",
    "plotly>=5.24.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
